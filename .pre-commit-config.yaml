# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: double-quote-string-fixer

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: [ --settings-path=poetry/pyproject.toml ]

  - repo: https://github.com/hadialqattan/pycln
    rev: v2.5.0
    hooks:
      - id: pycln
        args: [ --config=poetry/pyproject.toml ]

  # Note: the YAPF config is found in `.style.yapf` and `.yapfignore`
  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        language: python
        entry: yapf
        args: [ -r, -i, -p, -vv, --style=poetry/pyproject.toml]
        types: [ python ]
        additional_dependencies: [ toml ]

  - repo: https://github.com/crate-ci/typos
    rev: dictgen-v0.3.1
    hooks:
      - id: typos

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --config=poetry/pyproject.toml ]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [ --skip-string-normalization, --config=poetry/pyproject.toml ]

exclude: '^.*\.ini|install-poetry\.py|.*migrations/.*|.*\.xml|cryptopro/.+|.*statics/.*$'
