# Определение конфигурации для плагинов и утилит.
# https://docs.python.org/3/distutils/configfile.html

[flake8]
# D107: В общедоступном модуле отсутствует строка документации.
# D100: Пропущен докстринг в __init__(self, *args, **kwargs).
# D106: Отсутствует строка документации в публичном вложенном классе (например, class Meta).
# D104: Отсутствует строка документации в общедоступном пакете (__init__.py).
# D105: В магическом методе отсутствует строка документации.
ignore = D107, D100, D106, D104, D105

exclude =
    .git,
    __pycache__,
    .pytest_cache,
    */migrations/*,
    ./poetry,
    ./src/config/local.py,
    ./src/config/stand.py,
    ./tests
    ./docs/_build
    ./src/gis/admin

max-line-length = 120

max-complexity = 6

classmethod-decorators = 
    classmethod
    validator
    root_validator



[isort]
py_version=312
multi_line_output=3
include_trailing_comma=true
